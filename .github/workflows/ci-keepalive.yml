name: Autonomous CI & Render Keepalive

on:
  push:
    branches: [main]
  schedule:
    # Keep Render worker warm 24/7 & verify live production health every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render live radar backend & verify healthy response
        run: |
          curl -fsS --max-time 20 https://eye-radar.onrender.com/health | head -c 500
          echo ""
          curl -fsS --max-time 20 https://eye-radar.vercel.app/api/osint/feed?limit=3 | head -c 500
          echo ""

  verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run acceptance
